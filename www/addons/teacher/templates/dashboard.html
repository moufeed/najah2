<ion-view view-title="{{ 'mma.teacher.navbartitle' | translate }}" class="teacher_dashboard">
	<ion-nav-buttons side="secondary">
        <button class="button button-icon ion-person-stalker" ng-if="multiRole" ng-click="switchRotle($event)" aria-label="{{ 'mm.courses.filter' | translate }}"></button>
    </ion-nav-buttons>
    <ion-content padding="true" mm-state-class>


        <div ng-repeat="wid in widgets" ng-if="wid.name !== 'messages' && wid.name !== 'calendar'" ng-include="'addons/teacher/templates/widgets/'+ wid.name +'.html'"></div>

    </ion-content>
</ion-view>
