<ion-scroll style="height:100%" delegate-handle="slide1Scroll" >
    <div class="quizzes-slide">
        <ion-list class="list" ng-if="!QZ_NotEmpty">
            <ion-item class="item item-quiz" ng-repeat="quiz in course.quizzes"  ng-class-even="'even'">
                    <h3>{{ quiz.data.name }}</h3>
                   <p><img src="addons/teacher/img/start.svg" class="ico"><span>{{ quiz.data.timeopen }}</span> </p> 
                   <p><img src="addons/teacher/img/end.svg" class="ico" ><span> {{ quiz.data.timeclose }}</span> </p> 
                        <div class="item-footer" >
                               <a class="btn-link " ui-sref="site.mod_quiz({module: quiz, courseid: courseid})">  
                                     <i class="icon ion-eye"></i>
                                   <span>{{'mma.teacher.preview' | translate}}</span>
                                   </a>
                        </div>
            </ion-item>
        </ion-list>
        <div class="text-center" ng-if="!QZ_NotEmpty">
            <h5>{{ 'mma.teacher.no_data' | translate }}</h5>
        </div>
    </div>
  <ion-scroll>
