<div class="card latest_news" hide-until="feeds">
    <div ng-if="feeds.length >= 0">

        <div class="card-header" ng-class="(gender == 'f') ? 'gf' : (gender == 'm') ? 'gm' :''">
            {{ 'mma.teacher.lastnews' | translate }}
        </div>
        <div class="card-body">
            <ion-list class="list">
                <ion-item class="item item-thumbnail-left" ng-repeat="feed in feeds" ng-class-even="'even'" ng-click="openNews(feed)">
                    <img ng-src="{{feed.image}}">
                    <h2>{{feed.name }}</h2>
                    <small class="date">{{feed.date | date:'medium'}}</small>
                    <p>{{ feed.description | limitTo : 200 }}</p>
                </ion-item>
            </ion-list>
        </div>
    </div>
    <mma-tempty helper-class="info inside" icon="zmdi zmdi-calendar" ng-if="!feeds">
        <h4> {{ 'mma.teacher.lastnews' | translate }}</h4>
        <ion-spinner icon="lines" ng-if="!lnews.noData"></ion-spinner>
        <span ng-show="lnews.noData">  {{ 'mma.teacher.no_data' | translate }}</span>
    </mma-tempty>

</div>
