<ion-view>
    <ion-nav-title>{{'mma.portfolio.portfolio' | translate}}</ion-nav-title>
    <ion-content padding="true" mm-state-class scroll="false">

        <div class="list card">
            <div class="item item-avatar" ui-sref="site.cv">
                <img src="addons/portfolio/imgs/cv.png">
                <h2>{{'mma.portfolio.cv' | translate}}</h2>
            </div>
        </div>
        <div class="list card">
            <div class="item item-avatar" ui-sref="site.artifact({ id: 0 })">
                <img src="addons/portfolio/imgs/portfolio.png">
                <h2>{{'mma.portfolio.artifact' | translate}}</h2>
            </div>
        </div>
        <div class="list card">
            <div class="item item-avatar" ui-sref="site.views">
                <img src="addons/portfolio/imgs/views.png">
                <h2>{{'mma.portfolio.views' | translate}}</h2>
            </div>
        </div>

    </ion-content>
</ion-view>
