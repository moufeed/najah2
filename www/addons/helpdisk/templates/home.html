<ion-view>
    <ion-nav-title>{{'mma.helpdisk.title' | translate}}</ion-nav-title>
    <ion-nav-buttons side="secondary">
        <button class="button button-icon ion-plus" ng-click="add()" aria-label="{{ 'mm.fileuploader.uploadafile' | translate }}"></button>
    </ion-nav-buttons>
    <ion-content padding="true" mm-state-class scroll="false">


        <div class="list">
          <label class="item item-input item-stacked-label">
            <span class="input-label">{{'mma.helpdisk.email' | translate}}</span>
            <input type="email" ng-model="$ctrl.user.email">
          </label>
          <label class="item item-input item-stacked-label">
            <span class="input-label">{{'mma.helpdisk.mobile' | translate}}</span>
            <input type="text" ng-model="$ctrl.user.mobile">
          </label>
          <label class="item item-input item-stacked-label">
            <span class="input-label">{{'mma.helpdisk.details' | translate}}</span>
            <textarea ng-model="$ctrl.user.details"></textarea>
          </label>
          <button ng-click="$ctrl.addImage()" class="button button-full button-positive">
            {{'mma.helpdisk.image' | translate}}
          </button>
        </div>

    </ion-content>
</ion-view>
