<div class="course-content">
    <div class="content {{ dashboardCourse.contentClass }}">
        <div class="resources course-view">
            <div class="card resources">
                <div class="header">
                    <h2>resources</h2>
                </div>
                <div class="list">
                    <table>
                        <thead>
                            <tr>
                                <th>Resource</th>
                                <th>Section</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="forum in dashboardCourse.course.resources">
                                <td>{{ forum.data.name }}</td>
                                <td ng-bind-html="forum.data.intro"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
