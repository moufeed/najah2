<ion-view> 
    <ion-nav-title>{{ dashboardCourse.course.fullname }}</ion-nav-title>
    <ion-content padding="true" mm-state-class scroll="false">
        <mm-loading hide-until="dashboardCourse.courseLoaded">
               <mma-tab-slide-box tab="0"  ng-if="dashboardCourse.course">
		    	<div class="tsb-icons">
		    		<div class="tsb-ic-wrp">
                           <ion-scroll direction="x" class="tsb-hscroll">
                           <a href="javascript:;" class="ico syllabus-icon"> 
                               <img src="addons/dashboard/img/icons/syllabus.png">
                               <small>{{'mma.dashboard.syllabus' | translate}}</small>
                           </a>
                           <!--<a href="javascript:;" class="ico calendar-icon"> 
                               <img src="addons/dashboard/img/icons/calendar.png">
                               <small>{{'mma.teacher.calendar' | translate}}</small>
                               </a> -->
                           <a href="javascript:;" class="ico quizzes-icon"> 
                               <img src="addons/dashboard/img/icons/quizzes.png">
                               <small>{{'mma.dashboard.quizzes' | translate}}</small>
                               </a>
                           <a href="javascript:;" class="ico assignments-icon"> 
                               <img src="addons/dashboard/img/icons/assignments.png">
                               <small>{{'mma.dashboard.assignments' | translate}}</small>
                               </a>
                           <a href="javascript:;" class="ico forums-icon"> 
                               <img src="addons/dashboard/img/icons/forums.png">
                               <small>{{'mma.dashboard.forums' | translate}}</small>
                               </a> 
                           <a href="javascript:;" class="ico resources-icon"> 
                               <img src="addons/dashboard/img/icons/resources.png">
                               <small>{{'mma.dashboard.resources' | translate}}</small>
                           </a>
                        <a href="javascript:;" class="ico stamps-icon"> 
                               <img src="addons/dashboard/img/icons/gradebook.png">
                               <small>{{'mma.dashboard.gradebook' | translate}}</small>
                        </a>
                       </ion-scroll>
                           
					</div>
		    	</div>
		        <ion-slide-box show-pager="false" on-slide-changed="slideHasChanged($index)">
                       <ion-slide>
                            <ng-include src="'addons/dashboard/templates/course/syllabus.html'"></ng-include>
                       </ion-slide>
                       <!--<ion-slide>
                            <ng-include src="'addons/dashboard/templates/course/calendar.html'"></ng-include>
                       </ion-slide>-->
                       <ion-slide>
                           <ng-include src="'addons/dashboard/templates/course/quizzes.html'"></ng-include>
                       </ion-slide>
                       <ion-slide>
                           <ng-include src="'addons/dashboard/templates/course/assignments.html'"></ng-include>
                       </ion-slide>
                       <ion-slide>
                            <ng-include src="'addons/dashboard/templates/course/forums.html'"></ng-include>
                       </ion-slide>
                       <ion-slide>
                            <ng-include src="'addons/dashboard/templates/course/resources.html'"></ng-include>
                       </ion-slide>
                       <ion-slide>
                            <ng-include src="'addons/dashboard/templates/course/gradebook.html'"></ng-include>
                       </ion-slide>
	        </ion-slide-box>
         	</mma-tab-slide-box>
        </mm-loading>
    </ion-content>
</ion-view>
