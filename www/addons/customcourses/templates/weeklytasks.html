<ion-view view-title="{{ 'mma.dashboard.weekly_tasks' | translate }}">
    <ion-content mm-state-class class="mybadges">
        <mm-loading hide-until="weeklytasks.weeklyTasksLoaded">
                <div class = "row responsive-sm news-wrapper">
                    <div class="col news-col">
                        <div class="card weekly-tasks">
                            <div ng-if="weeklytasks.weeklyTasks.length">
                                <div class="card-header">
                                    {{ 'mma.dashboard.weekly_tasks' | translate }}
                                </div>
                                <div class="card-body">
                                    <ion-list class="list list-divider stamp-course" ng-repeat="course in weeklytasks.weeklyTasks">
                                        <p>{{ course.coursename }}</p>
                                        <ion-list class="list" ng-repeat="assign in course.weeklytasks.assign">
                                            <ion-item class="item item-thumbnail-left" ng-class-even="'even'">
                                                <img src="img/icons/assign.png">
                                                <h2>{{ assign.name }}</h2>
                                                <small>{{ assign.section }}</small>
                                            </ion-item>
                                        </ion-list>
                                        <ion-list class="list" ng-repeat="quiz in course.weeklytasks.quiz">
                                            <ion-item class="item item-thumbnail-left" ng-class-even="'even'">
                                                <img ng-src="img/icons/quizzes.png">
                                                <h2>{{ quiz.name }}</h2>
                                                <small>{{ quiz.section }}</small>
                                            </ion-item>
                                        </ion-list>
                                    </ion-list>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="no-data" ng-if="!weeklytasks.weeklyTasks.length">
                    <i class="zmdi zmdi-alert-triangle zmdi-hc-fw"></i><br/>
                    <p>{{ 'mma.dashboard.no_data' | translate }}</p>
                </div>
            </div>
            <!-- card weekly-tasks -->
        </mm-loading>
    </ion-content>
</ion-view>
