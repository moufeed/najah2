<ion-view view-title="{{ 'mma.customcourses.mybadges' | translate }}">
    <ion-content mm-state-class class="mybadges">
        <mm-loading hide-until="badges.badgesLoaded">
            <div class="card badges">
                <div class="header">
                    <h2>{{ 'mma.dashboard.badges' | translate }}</h2>
                </div>
                <div class="list">
                    <div class="dash-badges" ng-if="badges.badges.length">
                        <div class="item-badge" ng-repeat="badge in badges.badges">
                            <div class="image" ng-bind-html="badge.img">
                                <!--<img src="img/ionic.png" alt="{{ badge.name }} - {{ badge.coursename }}">-->
                            </div>
                            <div class="text">
                                <h3>{{ badge.name }}</h3>
                                <small>{{ badge.coursename }}</small>
                            </div>
                        </div>
                    </div>
                    <div class="no-data" ng-if="!badges.badges.length">
                        <i class="zmdi zmdi-alert-triangle zmdi-hc-fw"></i><br/>
                        <p>{{ 'mma.dashboard.no_data' | translate }}</p>
                    </div>
                </div>
            </div>
            <!-- card badges -->
        </mm-loading>
    </ion-content>
</ion-view>
