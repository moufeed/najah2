<ion-view view-title="{{ 'mma.customcourses.mybadges' | translate }}">
    <ion-content mm-state-class class="mybadges">
        <mm-loading hide-until="badges.badgesLoaded">

            <div class = "row responsive-sm news-wrapper">
                <div class="col news-col">
                    <div class="card badges">
                        <div  ng-if="badges.badges.length">
                            <div class="card-header">
                                    {{ 'mma.dashboard.badges' | translate }}
                            </div>
                            <div class="card-body">
                                <ion-list class="list">
                                    <ion-item class="item item-thumbnail-left" ng-repeat="badge in badges.badges"  ng-class-even="'even'">
                                        <img ng-bind-html="badge.img">
                                        <h2>{{badge.name }}</h2>
                                        <small>{{ badge.coursename }}</small>
                                    </ion-item>
                                </ion-list>
                            </div>
                        </div>
                        <div class="no-data" ng-if="!badges.badges.length">
                            <i class="zmdi zmdi-alert-triangle zmdi-hc-fw"></i><br/>
                            <p>{{ 'mma.dashboard.no_data' | translate }}</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- card badges -->
        </mm-loading>
    </ion-content>
</ion-view>
