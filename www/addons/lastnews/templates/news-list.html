<ion-view view-title="{{ 'mma.lastnews.title' | translate }}" class="latest_news">

<ion-content>
  <div ng-if="feeds">
    <ion-refresher on-refresh="doRefresh()"  pulling-text="{{ 'mma.lastnews.pulltorefresh' | translate }}" ></ion-refresher>
    <div class="list category-feeds">
      <a ng-repeat="feed in feeds" class="item card feed-card"  ng-click="openNews(feed)" ng-if="feeds.length > 0">
          <div class="row">
              <div class="col-67">
                 <div class="info news-content">
                   <h3 class="title">{{feed.name}}</h3>
                   <small class="date">{{feed.date | date:'medium'}}</small>  
                   <p>{{ feed.description | limitTo : 150 }}</p>
                 </div>
              </div>
              <div class="col-33">
                     <mma-pre-img ratio="_1_1" helper-class="">
                        <img class="thumbnail" ng-src="{{feed.image}}" mma-spinner-on-load> 
                     </mma-pre-img>
              </div>
          </div>
      </a>
      
    </div>
</div>
    <div class="card emptymsg info inside" ng-if="!feeds">
      <div class="text-center">
          <div class="ion-ios-paper icon"></div>
          	<h4>{{ 'mma.lastnews.title' | translate }}</h4>
				<ion-spinner icon="lines" ng-if="!nNews_noData"></ion-spinner>
				<span ng-show="nNews_noData">  {{ 'mma.lastnews.no_data' | translate }}</span>
      </div>
    </div>
 

  </ion-content>
</ion-view>
