<ion-modal-view>
    <ion-header-bar class="bar bar-header bar-positive">
        <button class="button button-clear button-primary " ng-click="modal.hide()">{{'mma.lastnews.close' | translate}}</button>
    </ion-header-bar>
    <ion-content class="padding">
        <ion-scroll direction="xy" zooming="true" min-zoom="1" style="height:100%;">
            <div class="list card msg-post">
                <div class="item item-avatar">
                    <img src="img/user-avatar.png" ng-src="{{message.pic}}">
                    <h2>{{message.firstname + ' ' + message.lastname }}</h2>
                    <p>{{message.email}}</p>
                </div>

                <div class="item item-body">
                    <div ng-bind-html="message.msg | trustedHtml"></div>
                </div>
            </div>
        </ion-scroll>
    </ion-content>
</ion-modal-view>
