<ion-view view-title="{{ 'mma.parent.childtitle' | translate }}" class="child_Page">
    <ion-content padding="true" mm-state-class>

        <mm-loading hide-until="child" loading-padding-top="loadingPaddingTop">
            <ion-list class="list">
                <ion-item class="item item-avatar">
                    <img ng-src="{{child.pic}}" src="addons/parent/img/avater.png">
                    <h4>{{child.firstname + " " + child.lastname}}</h4>
                    <p>{{child.lastprogram}}</p>
                </ion-item>
            </ion-list>
        </mm-loading>

        <div ng-repeat="wid in widgets" ng-if="wid.name !== 'news' && wid.name !== 'communicate' && wid.name !== 'calendar' && wid.name !== 'weekly-schedule'" ng-include="'addons/parent/templates/widgets/' + wid.name + '.html'"></div>

    </ion-content>
</ion-view>
