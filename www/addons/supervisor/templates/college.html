<ion-view>
    <ion-nav-title>{{ $ctrl.data.name }}</ion-nav-title>
    <ion-content padding="true" mm-state-class scroll="true" class="college-page">
        <mm-loading hide-until="$ctrl.dataLoaded">
            <div class="item-input-inset">
			  <label class="item-input-wrapper">
			    <i class="icon ion-ios-search placeholder-icon"></i>
			    <input type="search" ng-model="$ctrl.search" placeholder="{{'mma.supervisor.search' | translate}}">
			  </label>
			</div>
            <div class="row portfolio-items port-items">
                <div class="col col-50" ng-repeat="tech in $ctrl.data.teachers | filter: $ctrl.search">
                    <div class="list card">
		                <div class="item item-image">
		                    <img ng-src="{{ tech.img }}">
		                </div>
						<div class="item">
		                    <h2>{{ tech.name }}</h2>
		                </div>
		                <div class="item">
		                    <p>{{ tech.program }}</p>
		                </div>
		                <a class="item item-icon-right" ng-click="openModal(tech)">
						    <i class="icon ion-paper-airplane"></i>
						    {{ 'mma.supervisor.message' | translate }}
						</a>
						<a class="item item-icon-right" ui-sref="site.supervisorCourse({ tid: tech.id, cid: $ctrl.cid, teacher: tech.name })">
						    <i class="icon ion-ios-bookmarks"></i>
						    {{ 'mma.supervisor.courses' | translate }}
						</a>
						<a class="item item-icon-right" ui-sref="site.supervisorSchedule({ id: tech.id, teacher: tech })">
						    <i class="icon ion-briefcase"></i>
						    {{ 'mma.supervisor.program' | translate }}
						</a>
		            </div>
                </div>
            </div>
        </mm-loading>
    </ion-content>
</ion-view>
