<ion-view>
    <ion-nav-title>{{ $ctrl.teacher }}</ion-nav-title>
    <ion-content padding="true" mm-state-class scroll="true" class="college-page">
        <div class="item-input-inset">
		  <label class="item-input-wrapper">
		    <i class="icon ion-ios-search placeholder-icon"></i>
		    <input type="search" ng-model="$ctrl.search" placeholder="{{'mma.supervisor.search' | translate}}">
		  </label>
		</div>
        <div class="row portfolio-items port-items">
            <div class="col col-50" ng-repeat="course in $ctrl.courses | filter: $ctrl.search">
                <div class="card" ui-sref="site.supervisorLecture({ tid: $ctrl.tid, cid: course.id })">
	                <div class="item item-image">
	                    <img ng-src="{{ course.img }}">
	                </div>
					<div class="item">
	                    <h2>{{ course.name }}</h2>
	                </div>
	                <div class="item">
	                    <p>{{ course.program }}</p>
	                </div>
	                <div class="item">
	                    <p>{{'mma.supervisor.division' | translate}}: {{ course.division }}</p>
	                </div>
	            </div>
            </div>
        </div>
    </ion-content>
</ion-view>
